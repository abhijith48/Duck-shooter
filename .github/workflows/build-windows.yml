name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pygame PyOpenGL pyinstaller

      - name: Build EXE
        run: pyinstaller duck_game.spec

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: CyberDuck-Windows
          path: dist/duck_game.exe
